databases:
  - name: chronos-db
    databaseName: chronosdb
    user: chronos_admin
    plan: free

services:
  # Combined Frontend + Backend Web Service (avoids inter-service Cloudflare 429 on Free Tier)
  - type: web
    name: chronos-frontend
    env: python
    plan: free
    buildCommand: "cd backend && pip install -r requirements.txt"
    startCommand: "python start_all.py"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: chronos-db
          property: connectionString
      - key: CHRONOS_API
        value: http://127.0.0.1:8000
